<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiCred | Mais que crédito, parceria para ir mais longe</title>
  <meta name="description" content="MultiCred - Correspondente bancário no Sertão Pernambucano. Simule agora seu crédito.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="landing">
    <img
      src="assets/landing.png"
      alt="MultiCred - Mais que crédito, parceria para ir mais longe. Atendimento humanizado, simulação gratuita, liberação rápida."
      class="landing__image"
    >

    <!-- Área clicável: botão "SIMULE AGORA" -->
    <button class="hotspot hotspot--simule" aria-label="Simule agora"></button>

    <!-- Área clicável: botão "FALE CONOSCO" (WhatsApp) -->
    <button class="hotspot hotspot--whatsapp" aria-label="Fale conosco pelo WhatsApp"></button>
  </main>

  <script src="script.js"></script>
</body>
</html>
