<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCred</title>

    <meta name="description" content="Mais que crédito, parceria para ir mais longe.">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <header class="header">

            <a href="#" class="logo">
                <img src="assets/logo.png" alt="MultiCred">
            </a>

            <!-- ====================================================== -->
            <!-- ALTERAR LINK DO WHATSAPP AQUI                           -->
            <!-- ====================================================== -->

            <a href="https://wa.me/5500000000000" class="simulate-btn" target="_blank" rel="noopener">
                SIMULE AGORA
                <img src="assets/chat.png" alt="">
            </a>

        </header>

        <main>

            <section class="hero">

                <div class="top-line"></div>

                <h1>

                    <span class="orange">Mais que</span><br>

                    <span class="orange">crédito</span><span class="blue">,</span><br>

                    <span class="blue">parceria para</span><br>

                    <span class="blue">ir mais longe</span><span class="orange">.</span>

                </h1>

                <div class="modalidades">

                    <img src="assets/bolt.png" alt="">

                    <span>VÁRIAS MODALIDADES DE CRÉDITO</span>

                </div>

            </section>

            <section class="content">

                <aside class="cards">

                    <article class="card">

                        <img src="assets/user.png" alt="">

                        <p>
                            Atendimento<br>
                            humanizado
                        </p>

                    </article>

                    <article class="card">

                        <img src="assets/calculator.png" alt="">

                        <p>
                            Simulação<br>
                            gratuita
                        </p>

                    </article>

                    <article class="card">

                        <img src="assets/shield.png" alt="">

                        <p>
                            Liberação<br>
                            rápida
                        </p>

                    </article>

                </aside>

                <section class="photo-section">

                    <img class="dotted-line" src="assets/dotted-line.png" alt="">

                    <img class="bg-shape" src="assets/bg-shape.png" alt="">

                    <img class="hero-photo" src="assets/hero-photo.png" alt="Clientes felizes">

                </section>

            </section>

        </main>

    </div>

    <!-- ====================================================== -->
    <!-- BOTÃO FLUTUANTE                                        -->
    <!-- ALTERAR LINK DO WHATSAPP AQUI                           -->
    <!-- ====================================================== -->

    <a href="https://wa.me/5500000000000"
        class="floating-whatsapp"
        target="_blank"
        rel="noopener">

        <img src="assets/whatsapp-button.png" alt="Fale Conosco">

    </a>

    <script src="script.js"></script>

</body>

</html>
