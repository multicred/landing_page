<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MultiCred - Mais que crédito, parceria para ir mais longe.">

    <title>MultiCred</title>

    <!-- Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <header class="header">

        <a href="#" class="logo">
            <img src="assets/logo.png.png" alt="MultiCred">
        </a>

        <!-- ========================================================= -->
        <!-- ALTERAR LINK DO WHATSAPP AQUI                              -->
        <!-- ========================================================= -->
        <a
            href="https://wa.me/5500000000000"
            class="simulate-btn"
            target="_blank"
            rel="noopener noreferrer"
        >
            SIMULE AGORA
        </a>

    </header>

    <main>

        <section class="hero">

            <div class="top-line" aria-hidden="true"></div>

            <div class="hero-content">

                <div class="headline">

                    <h1>
                        <span class="orange">Mais que</span><br>
                        <span class="orange">crédito</span><span class="blue">,</span><br>
                        <span class="blue">parceria para</span><br>
                        <span class="blue">ir mais longe</span><span class="orange">.</span>
                    </h1>

                </div>

                <div class="modalities">

                    <img src="assets/bolt.png.png" alt="">

                    <span>VÁRIAS MODALIDADES DE CRÉDITO</span>

                </div>

            </div>

        </section>

        <section class="content">

            <aside class="benefits">

                <article class="benefit-card">

                    <img
                        src="assets/user.png.png"
                        alt="Atendimento Humanizado"
                    >

                    <p>
                        Atendimento<br>
                        humanizado
                    </p>

                </article>

                <article class="benefit-card">

                    <img
                        src="assets/calculator.png.png"
                        alt="Simulação Gratuita"
                    >

                    <p>
                        Simulação<br>
                        gratuita
                    </p>

                </article>

                <article class="benefit-card">

                    <img
                        src="assets/shield.png.png"
                        alt="Liberação Rápida"
                    >

                    <p>
                        Liberação<br>
                        rápida
                    </p>

                </article>

            </aside>

            <section class="hero-photo-area">

                <img
                    src="assets/dotted-line.png.png"
                    alt=""
                    class="dotted-line"
                    aria-hidden="true"
                >

                <img
                    src="assets/bg-shape.png.png"
                    alt=""
                    class="background-shape"
                    aria-hidden="true"
                >

                <img
                    src="assets/hero-photo.png.png"
                    alt="Clientes MultiCred"
                    class="hero-photo"
                >

            </section>

        </section>

    </main>

</div>

<!-- ========================================================= -->
<!-- BOTÃO FLUTUANTE                                            -->
<!-- ALTERAR LINK DO WHATSAPP AQUI                              -->
<!-- ========================================================= -->

<a
    href="https://wa.me/5500000000000"
    class="floating-whatsapp"
    target="_blank"
    rel="noopener noreferrer"
>

    <img
        src="assets/whatsapp-button.png.png"
        alt="Fale Conosco"
    >

</a>
